<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0d12;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot {
            width: 100%;
            max-width: 850px;
            height: 88vh;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            background: #151821;
            border: 1px solid #2b303c;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .header {
            padding: 18px 22px;
            background: #1b1f2a;
            border-bottom: 1px solid #2b303c;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 5px 0 0;
            color: #aeb5c3;
            font-size: 13px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bot .bubble {
            background: #202532;
            border: 1px solid #303746;
        }

        .user .bubble {
            background: #333a49;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #2b303c;
            background: #11141b;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 140px;
            padding: 13px 15px;
            border: 1px solid #343a47;
            border-radius: 13px;
            outline: none;
            background: #1b1f28;
            color: #fff;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #626b7d;
        }

        #sendButton {
            width: 95px;
            border: 0;
            border-radius: 13px;
            background: #e8e8e8;
            color: #111;
            font-weight: 700;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hint {
            margin: 9px 3px 0;
            color: #7f8795;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chatbot {
                height: 100vh;
                min-height: 100vh;
                border-radius: 0;
            }

            .messages {
                padding: 16px;
            }

            .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>
    <main class="chatbot">
        <header class="header">
            <h1>🕷️ Spider-Man AI</h1>
            <p>Ask about Spider-Man movies and series • English • தமிழ் • Thanglish</p>
        </header>

        <section class="messages" id="messages">
            <div class="message bot">
                <div class="bubble">
                    Hi! I'm Spider-Man AI. 🕷️<br>
                    Ask me anything about Spider-Man movies and series.
                </div>
            </div>
        </section>

        <footer class="input-area">
            <div class="input-row">
                <textarea
                    id="messageInput"
                    placeholder="Ask about Spider-Man..."
                    rows="1"
                ></textarea>
                <button id="sendButton">Send</button>
            </div>
            <div class="hint">Spider-Man topics only.</div>
        </footer>
    </main>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, sender) {
            const wrapper = document.createElement("div");
            wrapper.className = `message ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message || sendButton.disabled) {
                return;
            }

            addMessage(message, "user");
            input.value = "";
            input.style.height = "48px";
            sendButton.disabled = true;

            addMessage("Thinking...", "bot");
            const thinkingBubble = messages.lastElementChild.querySelector(".bubble");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.reply || "Request failed");
                }

                thinkingBubble.textContent = data.reply;
            } catch (error) {
                thinkingBubble.textContent =
                    "Sorry, I couldn't connect to the Spider-Man AI right now.";
            } finally {
                sendButton.disabled = false;
                input.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        }

        sendButton.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener("input", () => {
            input.style.height = "48px";
            input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
        });
    </script>
</body>
</html>
